# Group integration environment: services talk over the compose network by service name.
services:
  auth:
    build: ../member1
    environment:
      PORT: 3001
      TOKEN_TTL_SECONDS: 3600
    ports:
      - "127.0.0.1:3001:3001"
  notification:
    build: ../member2
    environment:
      PORT: 3002
      AUTH_URL: http://auth:3001
      SERVICE_KEY: ${SERVICE_KEY:-local-dev-service-key}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      auth:
        condition: service_healthy
  robot:
    build: .
    profiles: [test]
    environment:
      AUTH_URL: http://auth:3001
      NOTIFICATION_URL: http://notification:3002
      SERVICE_KEY: ${SERVICE_KEY:-local-dev-service-key}
    volumes:
      - ./results:/tests/results
    depends_on:
      auth:
        condition: service_healthy
      notification:
        condition: service_healthy
