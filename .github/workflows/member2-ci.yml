name: Member2 Notification CI
on:
  push:
    branches: [phlu, main]
    paths: ['member2/**', '.github/workflows/member2-ci.yml']
  pull_request:
    paths: ['member2/**', '.github/workflows/member2-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: member2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker build -t unireserve-notification:ci .
      - name: Container health smoke
        run: |
          docker compose up -d --wait
          curl --fail http://127.0.0.1:3002/health
      - name: Teardown
        if: always()
        run: docker compose down
