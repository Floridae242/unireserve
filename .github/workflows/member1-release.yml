name: Member1 Auth Registry Release
on:
  push:
    tags: ['member1-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: member1/package-lock.json
      - name: Validate version and image name
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$RELEASE_TAG" =~ ^member1-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${RELEASE_TAG#member1-v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY_OWNER,,}/unireserve-auth" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: member1
      - run: npm run typecheck && npm test
        working-directory: member1
      - name: Test container before publish
        working-directory: member1
        run: |
          docker compose up -d --build --wait
          curl --fail http://127.0.0.1:3001/health
      - name: Teardown
        if: always()
        working-directory: member1
        run: docker compose down
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: member1
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
