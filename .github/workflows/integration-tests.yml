name: Integration Tests (Robot Framework)
on:
  push:
    branches: [phlu, main]
    paths: ['member1/**', 'member2/**', 'automation-tests/**', '.github/workflows/integration-tests.yml']
  pull_request:
    paths: ['member1/**', 'member2/**', 'automation-tests/**', '.github/workflows/integration-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Robot Framework suites against Auth + Notification containers
        run: docker compose --profile test run --rm --build robot
      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: automation-tests/results/
          if-no-files-found: ignore
      - name: Teardown
        if: always()
        run: docker compose --profile test down
